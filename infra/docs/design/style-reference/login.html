<!DOCTYPE html>
<html lang="fa" dir="rtl" data-theme="light">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>ورود به هومانا</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com"></script>
<style>
  :root{--bg:#E9E5DD;--ink:#2E2B26;--sub:#7A756B;--sd:#C9C3B6;--sl:#FFFFFF;--bar:rgba(46,43,38,.13)}
  [data-theme="dark"]{--bg:#262421;--ink:#EDE9E1;--sub:#A09A8E;--sd:#1D1B18;--sl:#32302B;--bar:rgba(237,233,225,.13)}
  *{-webkit-tap-highlight-color:transparent}
  body{background:var(--bg);color:var(--ink);font-family:'Vazirmatn',sans-serif;transition:background .3s,color .3s}
  .t-sub{color:var(--sub)}
  input::placeholder{color:var(--sub)}
  ::selection{background:rgba(13,148,136,.25)}

  .neu-in{background:var(--bg);box-shadow:inset 5px 5px 10px var(--sd),inset -5px -5px 10px var(--sl)}
  .neu-sm{background:var(--bg);box-shadow:5px 5px 12px var(--sd),-5px -5px 12px var(--sl);transition:.2s}
  .press:active{transform:translateY(0);box-shadow:inset 4px 4px 10px var(--sd),inset -4px -4px 10px var(--sl)}
  .cta{background:linear-gradient(135deg,#14B8A6,#0D9488);color:#fff;
       box-shadow:6px 6px 14px var(--sd),-6px -6px 14px var(--sl),0 8px 24px rgba(13,148,136,.35);transition:.25s}
  .cta:hover{filter:brightness(1.06);transform:translateY(-2px)}
  .cta:active{transform:translateY(0)}

  .glow{position:fixed;border-radius:9999px;filter:blur(110px);pointer-events:none;z-index:0;opacity:.22}
  [data-theme="dark"] .glow{opacity:.10}
  [data-theme="dark"] .only-moon{display:none}
  html:not([data-theme="dark"]) .only-sun{display:none}

  /* فوکوس ورودی: فرورفته + حلقه داخلی teal */
  .fld:focus-within{box-shadow:inset 5px 5px 10px var(--sd),inset -5px -5px 10px var(--sl),0 0 0 2px rgba(13,148,136,.45)}
  .fld input{outline:none}

  /* چک‌باکس سفارشی */
  .cbx{appearance:none;width:20px;height:20px;border-radius:7px;cursor:pointer;flex-shrink:0;
       background:var(--bg);box-shadow:inset 3px 3px 6px var(--sd),inset -3px -3px 6px var(--sl);transition:.2s;position:relative}
  .cbx:checked{background:linear-gradient(135deg,#14B8A6,#0D9488);
       box-shadow:2px 2px 6px var(--sd),-2px -2px 6px var(--sl)}
  .cbx:checked::after{content:'✓';position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
       color:#fff;font-size:12px;font-weight:900}

  /* لرزش فرم در خطا */
  @keyframes shake{20%,60%{transform:translateX(-6px)}40%,80%{transform:translateX(6px)}}
  .shake{animation:shake .4s}

  /* ضربان لوگو */
  .pulse{stroke-dasharray:70;stroke-dashoffset:70;animation:draw 1.2s .5s ease forwards}
  @keyframes draw{to{stroke-dashoffset:0}}
  .beat{transform-box:fill-box;transform-origin:center}
  .beat-host:hover .beat{animation:hb 1s ease infinite}
  @keyframes hb{25%{transform:scaleY(1.55)}55%{transform:scaleY(.85)}80%{transform:scaleY(1.2)}}
</style>
</head>
<body class="min-h-screen flex items-center justify-center p-4 overflow-hidden">

<div class="glow" style="width:480px;height:480px;background:#14B8A6;top:-160px;left:-140px"></div>
<div class="glow" style="width:420px;height:420px;background:#F59E0B;bottom:-160px;right:-140px;opacity:.16"></div>

<main class="relative z-10 w-full max-w-[420px]">

  <!-- ═══ کارت لاگین ═══ -->
  <div class="neu-sm rounded-[36px] p-8 sm:p-10">

    <!-- لوگو -->
    <div class="flex flex-col items-center mb-8">
      <div class="beat-host cursor-pointer" onclick="toggleTheme()">
        <svg width="84" height="84" viewBox="0 0 96 96">
          <defs>
            <linearGradient id="gM" x1="0" y1="0" x2="1" y2="1">
              <stop offset="0" stop-color="#14B8A6"/><stop offset="1" stop-color="#0D9488"/>
            </linearGradient>
            <filter id="neuM" x="-40%" y="-40%" width="180%" height="180%">
              <feDropShadow dx="3" dy="3" stdDeviation="3" flood-color="#C9C3B6"/>
              <feDropShadow dx="-3" dy="-3" stdDeviation="3" flood-color="#FFFFFF"/>
            </filter>
          </defs>
          <rect x="8" y="8" width="80" height="80" rx="24" fill="url(#gM)" filter="url(#neuM)"/>
          <g stroke="#fff" stroke-width="6" fill="none" stroke-linecap="round" stroke-linejoin="round">
            <path d="M31 26 V70 M65 26 V70"/>
            <path class="pulse beat" d="M31 48 H38 L44 37 L52 59 L58 48 H65"/>
          </g>
        </svg>
      </div>
      <p class="text-2xl font-black mt-4">هومانا</p>
      <p class="t-sub text-xs mt-1.5">ورود به پنل مدیریت کلینیک</p>
    </div>

    <!-- فرم -->
    <form id="f" class="flex flex-col gap-4" onsubmit="return doLogin(event)">
      <div>
        <label class="text-xs t-sub font-bold block mb-2 mr-1">شماره موبایل یا نام کاربری</label>
        <div class="fld neu-in rounded-2xl flex items-center gap-2.5 px-4 transition-shadow">
          <svg class="t-sub shrink-0" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
          <input id="u" class="bg-transparent w-full py-3.5 text-sm font-medium" placeholder="مثلاً sara@parsclinic" autocomplete="username">
        </div>
      </div>
      <div>
        <label class="text-xs t-sub font-bold block mb-2 mr-1">رمز عبور</label>
        <div class="fld neu-in rounded-2xl flex items-center gap-2.5 px-4 transition-shadow">
          <svg class="t-sub shrink-0" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
          <input id="p" type="password" class="bg-transparent w-full py-3.5 text-sm font-medium" placeholder="••••••••" autocomplete="current-password">
          <button type="button" onclick="togglePw()" class="t-sub hover:text-teal-600 transition shrink-0" tabindex="-1">
            <svg id="eye" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
          </button>
        </div>
      </div>

      <div class="flex items-center justify-between px-1 mt-1">
        <label class="flex items-center gap-2.5 text-xs font-bold t-sub cursor-pointer">
          <input type="checkbox" class="cbx" checked> مرا به خاطر بسپار
        </label>
        <a href="#" class="text-xs font-bold text-teal-600 hover:opacity-70 transition">رمزم را فراموش کردم</a>
      </div>

      <button class="cta rounded-2xl py-4 font-extrabold text-[15px] mt-2">ورود به پنل</button>
    </form>

    <!-- جداکننده -->
    <div class="flex items-center gap-3 my-6">
      <div class="h-px flex-1" style="background:var(--bar)"></div>
      <span class="text-[11px] t-sub font-bold">یا</span>
      <div class="h-px flex-1" style="background:var(--bar)"></div>
    </div>

    <!-- ورود با کد یکبارمصرف -->
    <button onclick="otp()" class="neu-sm press rounded-2xl w-full py-3.5 text-sm font-bold t-sub hover:text-teal-600 transition flex items-center justify-center gap-2">
      <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M21 2l-2 2m-7.6 7.6a2 2 0 1 0 2.8 2.8L21 5M15 5l4 4"/><path d="M19 13v5a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V7a2 2 0 0 1 2-2h5"/></svg>
      ورود با کد پیامکی
    </button>

    <p class="text-center text-xs t-sub mt-7">
      کلینیک شما عضو هومانا نیست؟
      <a href="#" class="font-bold text-teal-600 hover:opacity-70 transition">درخواست دمو</a>
    </p>
  </div>

  <!-- دکمه تم -->
  <div class="flex justify-center mt-5">
    <button onclick="toggleTheme()" class="neu-sm press rounded-2xl p-3.5 t-sub hover:text-teal-600 transition">
      <svg class="only-moon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
      <svg class="only-sun" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
    </button>
  </div>
</main>

<script>
  // نمایش/مخفی رمز
  function togglePw(){
    const p=document.getElementById('p');
    p.type=p.type==='password'?'text':'password';
    document.getElementById('eye').style.opacity=p.type==='password'?'1':'.45';
  }

  // دموی اعتبارسنجی — بعداً به API خودت وصل می‌شه
  function doLogin(e){
    e.preventDefault();
    const u=document.getElementById('u').value.trim();
    const p=document.getElementById('p').value.trim();
    if(!u||!p){
      const f=document.getElementById('f');
      f.classList.remove('shake');void f.offsetWidth;f.classList.add('shake');
      return false;
    }
    // TODO: fetch('/auth/login', {method:'POST', body:JSON.stringify({u,p})})
    alert('✅ دمو: اینجا به API لاگین وصل می‌شه');
    return false;
  }

  function otp(){alert('دمو: فرم ورود با کد پیامکی اینجا باز می‌شه');}
  function toggleTheme(){const r=document.documentElement;r.dataset.theme=r.dataset.theme==='dark'?'light':'dark'}
</script>
</body>
</html>
